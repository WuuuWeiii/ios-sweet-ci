name: gpu-userland

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          brew install meson ninja bison pkg-config
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build libdrm stand-in + Mesa 25.0.7 (freedreno, OSMesa)
        env:
          GPU_EAGL_WORK: ${{ runner.temp }}/gpu-eagl
        run: |
          bash gpu/eagl/mesa/build-mesa.sh
          ls -l "$GPU_EAGL_WORK/out"

      - name: Build EAGL shim (libsweetgl) for CoreAnimation's GL renderer
        env:
          GPU_EAGL_WORK: ${{ runner.temp }}/gpu-eagl
        run: |
          bash gpu/eagl/build-eagl.sh
      - name: Build Bergamota EAGL injection payload (M7)
        env:
          GPU_EAGL_WORK: ${{ runner.temp }}/gpu-eagl
        run: |
          bash gpu/eagl-bergamota/build-eagl-bergamota.sh

      - name: Build userspace GPU tests (IOKit + OSMesa)
        env:
          GPU_EAGL_WORK: ${{ runner.temp }}/gpu-eagl
        run: |
          bash gpu/test/build-tests.sh
          file "$GPU_EAGL_WORK"/out/tests/* || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gpu-userland
          path: |
            ${{ runner.temp }}/gpu-eagl/out/**
            ${{ runner.temp }}/gpu-eagl/out-eagl/**
